name: Continuous Integration
on: [push, pull_request]

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - name: using Node.js
          uses: actions/setup-node@v2
          with:
            node-version: '24.x'
        - name: Install dependencies
          run: npm install
               npm start