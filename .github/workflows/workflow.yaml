name: Continuous Integration
on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: Semgrep
        run: semgrep scan --config auto --sarif --output semgrep.sarif --error app/app-student/
      - name: Enviar resultado ao GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Auditar dependências (SCA)
        working-directory: app/app-student
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t my-app-image:latest ./app/app-student
      - uses: aquasecurity/trivy-action@v0.9.0   # atualize para uma versão recente
        with:
          image-ref: my-app-image:latest
          format: sarif
          output: trivy-report.sarif
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: 1
      - name: Enviar resultado ao GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-report.sarif
          category: trivy

  deploy:
    runs-on: ubuntu-latest
    needs: [semgrep, npm-audit, gitleaks, trivy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}